<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Media Collection (Books)</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F2F2F2;
            padding: 20px;
        }

        #media-container > div {
            display: flex;
            align-items: flex-start;
            background-color: white;
            padding: 14px;
            margin-bottom: 22px;
            border-radius: 6px;
            box-shadow: 0 0 4px rgba(0,0,0,0.2);
            gap: 20px;
        }

        #media-container img {
            width: 110px;
            height: 150px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
        }

        #media-container h3 {
            margin: 0 0 8px 0;
            font-size: 20px;
        }

        #media-container p {
            margin: 4px 0;
            font-size: 16px;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <h1>Book Collection</h1>

    <div id="media-container"></div>

    <script src="../scripts/books.js"></script>


</body>
</html>
